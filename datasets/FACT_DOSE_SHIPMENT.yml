unique_name: FACT_DOSE_SHIPMENT
object_type: dataset
label: FACT_DOSE_SHIPMENT
connection_id: Connection - BIOPHARMA_PORTFOLIO_OPS
sql: |-
  SELECT s.*,
    CASE WHEN s.WEEK_DATE_KEY = m.MAX_WEEK THEN 1 ELSE 0 END AS IS_LATEST_WEEK,
    CASE WHEN s.WEEK_DATE_KEY = m.MAX_WEEK THEN s.PATIENTS_ON_TREATMENT ELSE 0 END AS CURRENT_PATIENTS_ON_TREATMENT,
    CASE WHEN s.WEEK_DATE_KEY = m.MAX_WEEK THEN s.SITE_DOSES_ON_HAND ELSE 0 END AS CURRENT_SITE_DOSES_ON_HAND
  FROM SUPPLY_CHAIN_OTD_DEMO.BIOPHARMA_PORTFOLIO_OPS.FACT_DOSE_SHIPMENT s
  CROSS JOIN (SELECT MAX(WEEK_DATE_KEY) AS MAX_WEEK FROM SUPPLY_CHAIN_OTD_DEMO.BIOPHARMA_PORTFOLIO_OPS.FACT_DOSE_SHIPMENT) m
columns:
- name: SHIPMENT_ID
  data_type: decimal
- name: WEEK_DATE_KEY
  data_type: decimal
- name: SITE_ID
  data_type: decimal
- name: PROGRAM_ID
  data_type: decimal
- name: COUNTERPARTY_ID
  data_type: decimal
- name: SHIPMENT_COUNT
  data_type: decimal
- name: DOSES_SHIPPED
  data_type: decimal
- name: DOSES_ADMINISTERED
  data_type: decimal
- name: TEMPERATURE_EXCURSIONS
  data_type: decimal
- name: DOSES_LOST_TO_EXCURSION
  data_type: decimal
- name: SHIPMENT_LEAD_TIME_DAYS
  data_type: decimal
- name: SITE_DOSES_ON_HAND
  data_type: decimal
- name: PATIENTS_ON_TREATMENT
  data_type: decimal
- name: IS_LATEST_WEEK
  data_type: decimal
- name: CURRENT_PATIENTS_ON_TREATMENT
  data_type: decimal
- name: CURRENT_SITE_DOSES_ON_HAND
  data_type: decimal
